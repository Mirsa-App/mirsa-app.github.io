name: Sync source and publish website
on:
  push:
    branches: [main]
  schedule:
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mirsa-website
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Mirror the official source feed
        run: python3 scripts/sync-source.py
      - name: Save changed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync official Mirsa source feed"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Stage public website files
        run: |
          mkdir _site
          cp index.html hark.css hark-hero.css hark.js mirsa-icon.png mirsa-hero.png .nojekyll source.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
